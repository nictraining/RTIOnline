# src/main/resources/application.properties

# Spring Boot Application Name
spring.application.name=RtiPioApi

# Server Port
server.port=8081

# Spring Data JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# PostgreSQL Database Connection Properties
spring.datasource.url=jdbc:postgresql://localhost:5432/rtipiodb
spring.datasource.username=rtiopuser
spring.datasource.password=rtiopass
spring.datasource.driver-class-name=org.postgresql.Driver

# For running data.sql script on application startup (for development/testing)
spring.sql.init.mode=always

# JWT Configuration
# IMPORTANT: Replace with a very strong, random secret key for production.
# Generate with, e.g., 'openssl rand -base64 32'
app.jwtSecret=YourStrongSecretKeyForJWTSigningAndVerification_ReplaceMeInProduction
app.jwtExpirationMs=86400000

# File Storage Configuration
# The local directory where uploaded files will be saved.
app.file-storage.upload-dir=./uploads
# The base URL for accessing the uploaded files.
# This might be your server's address and a specific path.
app.file-storage.base-url=/files/

# Logging Configuration - INCREASED FOR DEBUGGING
logging.level.root=DEBUG
logging.level.com.example.RtiPioApi=DEBUG
logging.level.org.springframework=DEBUG
logging.level.org.hibernate=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicExtractor=TRACE
# Add this for security debugging
logging.level.org.springframework.security=DEBUG

# SpringDoc OpenAPI configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
